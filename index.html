<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#08111f"
  >

  <meta
    name="description"
    content="DALZON SHULE — Plateforme numérique de gestion scolaire, notes, cours, présences, documents, calendrier et communication."
  >

  <title>DALZON SHULE — Connecter l'École à la Maison</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    href="https://i.imghos.co/ScqSjIHB.png"
  >

  <link
    rel="apple-touch-icon"
    href="https://i.imghos.co/ScqSjIHB.png"
  >

  <!-- =====================================================
       POLICES
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- =====================================================
       FONT AWESOME
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- =====================================================
       STYLE
  ====================================================== -->

  <style>
    :root {
      --bg: #050b14;
      --bg-soft: #08111f;
      --panel: rgba(10, 22, 38, .78);
      --panel-strong: rgba(12, 27, 46, .94);

      --border: rgba(255, 255, 255, .09);
      --border-light: rgba(255, 255, 255, .14);

      --text: #f5f8fc;
      --muted: #8e9bad;

      --blue: #2589ff;
      --blue-soft: rgba(37, 137, 255, .13);

      --green: #24d18b;
      --red: #ff5d73;
      --orange: #ffb347;

      --sidebar-width: 270px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(37, 137, 255, .08),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(36, 209, 139, .05),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family: "Inter", sans-serif;

      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =====================================================
       LOGIN
    ====================================================== */

    #login-screen {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      width: 100%;

      padding: 38px 32px;

      border: 1px solid var(--border);
      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.015)
        ),
        var(--panel);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 25px 70px rgba(0,0,0,.35);
    }

    .login-logo {
      width: 82px;
      height: 82px;

      display: block;

      margin: 0 auto 22px;

      object-fit: contain;

      border-radius: 20px;
    }

    .login-title {
      text-align: center;

      font-family: "Space Grotesk", sans-serif;

      font-size: 28px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;

      color: var(--muted);

      font-size: 14px;

      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 600;

      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper > i {
      position: absolute;

      left: 15px;
      top: 50%;

      transform: translateY(-50%);

      color: var(--muted);

      pointer-events: none;
    }

    .form-input {
      width: 100%;

      min-height: 50px;

      padding:
        0 15px 0 44px;

      border: 1px solid var(--border);

      border-radius: 13px;

      outline: none;

      background: rgba(255,255,255,.035);

      color: var(--text);

      transition:
        border-color .2s,
        background .2s,
        box-shadow .2s;
    }

    .form-input:focus {
      border-color: rgba(37,137,255,.55);

      background: rgba(37,137,255,.045);

      box-shadow:
        0 0 0 4px rgba(37,137,255,.08);
    }

    .password-toggle {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: var(--muted);
    }

    #password {
      padding-right: 48px;
    }

    .login-button {
      width: 100%;

      min-height: 52px;

      margin-top: 8px;

      border: 0;
      border-radius: 13px;

      background: var(--blue);

      color: white;

      font-weight: 700;

      box-shadow:
        0 12px 30px rgba(37,137,255,.20);

      transition:
        transform .2s,
        filter .2s;
    }

    .login-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      display: none;

      margin-top: 15px;

      padding: 12px 14px;

      border: 1px solid rgba(255,93,115,.22);

      border-radius: 12px;

      background: rgba(255,93,115,.08);

      color: #ff9aaa;

      font-size: 13px;

      line-height: 1.5;
    }

    .login-error.show {
      display: block;
    }

    /* =====================================================
       APPLICATION
    ====================================================== */

    #app-screen {
      display: none;

      min-height: 100vh;
    }

    #app-screen.active {
      display: flex;
    }

    .sidebar {
      position: fixed;

      z-index: 100;

      left: 0;
      top: 0;
      bottom: 0;

      width: var(--sidebar-width);

      padding: 22px 16px;

      background:
        linear-gradient(
          180deg,
          rgba(8,17,31,.98),
          rgba(5,11,20,.98)
        );

      border-right: 1px solid var(--border);

      overflow-y: auto;
    }

    .sidebar-brand {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 8px 10px 22px;

      margin-bottom: 10px;

      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand img {
      width: 44px;
      height: 44px;

      border-radius: 12px;

      object-fit: contain;
    }

    .sidebar-brand-text {
      min-width: 0;
    }

    .sidebar-brand-title {
      font-family: "Space Grotesk", sans-serif;

      font-size: 16px;

      font-weight: 700;
    }

    .sidebar-brand-subtitle {
      color: var(--muted);

      font-size: 11px;

      margin-top: 3px;
    }

    .nav-section {
      margin-top: 20px;
    }

    .nav-section-title {
      padding: 0 11px 8px;

      color: #64748b;

      font-size: 10px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: .12em;
    }

    .nav-link {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 11px 12px;

      margin-bottom: 4px;

      border: 1px solid transparent;

      border-radius: 11px;

      background: transparent;

      color: #aeb9c8;

      text-align: left;

      transition:
        background .2s,
        color .2s,
        border-color .2s;
    }

    .nav-link i {
      width: 19px;

      text-align: center;

      font-size: 14px;
    }

    .nav-link:hover {
      background: rgba(255,255,255,.035);

      color: white;
    }

    .nav-link.active {
      background: var(--blue-soft);

      border-color: rgba(37,137,255,.16);

      color: white;
    }

    .sidebar-bottom {
      margin-top: 25px;

      padding-top: 15px;

      border-top: 1px solid var(--border);
    }

    .logout-button {
      color: #ff8b9b;
    }

    /* =====================================================
       MAIN
    ====================================================== */

    .main-area {
      width: calc(100% - var(--sidebar-width));

      margin-left: var(--sidebar-width);

      min-height: 100vh;
    }

    .topbar {
      position: sticky;

      top: 0;

      z-index: 50;

      height: 72px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 28px;

      border-bottom: 1px solid var(--border);

      background: rgba(5,11,20,.82);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .mobile-menu {
      display: none;

      width: 40px;
      height: 40px;

      border: 1px solid var(--border);

      border-radius: 10px;

      background: rgba(255,255,255,.03);

      color: white;
    }

    .topbar-title {
      font-family: "Space Grotesk", sans-serif;

      font-size: 19px;

      font-weight: 700;
    }

    .topbar-user {
      display: flex;

      align-items: center;

      gap: 11px;
    }

    .topbar-user-info {
      text-align: right;
    }

    .topbar-user-name {
      font-size: 13px;

      font-weight: 700;
    }

    .topbar-user-role {
      margin-top: 2px;

      color: var(--muted);

      font-size: 11px;
    }

    .avatar {
      width: 40px;
      height: 40px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          rgba(37,137,255,.30),
          rgba(36,209,139,.18)
        );

      border: 1px solid var(--border-light);

      color: white;

      font-size: 13px;

      font-weight: 700;
    }

    .content {
      padding: 28px;
    }

    /* =====================================================
       GENERIC CARDS
    ====================================================== */

    .page-header {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 25px;
    }

    .page-title {
      font-family: "Space Grotesk", sans-serif;

      font-size: 27px;

      font-weight: 700;
    }

    .page-description {
      margin-top: 7px;

      color: var(--muted);

      font-size: 13px;
    }

    .cards-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(190px, 1fr)
        );

      gap: 16px;
    }

    .card {
      border: 1px solid var(--border);

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        ),
        var(--panel);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      padding: 20px;
    }

    .stat-card {
      position: relative;

      overflow: hidden;
    }

    .stat-card::after {
      content: "";

      position: absolute;

      width: 90px;
      height: 90px;

      right: -35px;
      bottom: -35px;

      border-radius: 50%;

      background: rgba(37,137,255,.07);
    }

    .stat-icon {
      width: 38px;
      height: 38px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: var(--blue-soft);

      color: var(--blue);

      margin-bottom: 15px;
    }

    .stat-value {
      font-family: "Space Grotesk", sans-serif;

      font-size: 26px;

      font-weight: 700;
    }

    .stat-label {
      color: var(--muted);

      font-size: 12px;

      margin-top: 4px;
    }

    /* =====================================================
       TABLE
    ====================================================== */

    .table-container {
      width: 100%;

      overflow-x: auto;

      border: 1px solid var(--border);

      border-radius: 16px;

      background: var(--panel);
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 650px;
    }

    th,
    td {
      padding: 14px 16px;

      border-bottom: 1px solid var(--border);

      text-align: left;

      font-size: 13px;
    }

    th {
      color: #aeb9c8;

      background: rgba(255,255,255,.025);

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .04em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td {
      color: #dce4ed;
    }

    /* =====================================================
       BUTTONS
    ====================================================== */

    .btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 42px;

      padding: 0 15px;

      border: 1px solid var(--border);

      border-radius: 10px;

      background: rgba(255,255,255,.035);

      color: white;

      transition:
        background .2s,
        border-color .2s,
        transform .2s;
    }

    .btn:hover {
      background: rgba(255,255,255,.06);

      border-color: var(--border-light);
    }

    .btn-primary {
      border-color: rgba(37,137,255,.3);

      background: var(--blue);
    }

    .btn-danger {
      border-color: rgba(255,93,115,.25);

      background: rgba(255,93,115,.10);

      color: #ff91a0;
    }

    /* =====================================================
       FORMS APP
    ====================================================== */

    .app-input,
    .app-select,
    .app-textarea {
      width: 100%;

      border: 1px solid var(--border);

      border-radius: 10px;

      background: rgba(255,255,255,.035);

      color: white;

      outline: none;
    }

    .app-input,
    .app-select {
      height: 44px;

      padding: 0 12px;
    }

    .app-textarea {
      min-height: 100px;

      padding: 12px;

      resize: vertical;
    }

    .app-input:focus,
    .app-select:focus,
    .app-textarea:focus {
      border-color: rgba(37,137,255,.5);

      box-shadow:
        0 0 0 3px rgba(37,137,255,.07);
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 15px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    /* =====================================================
       BADGES
    ====================================================== */

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 5px 9px;

      border-radius: 999px;

      background: rgba(37,137,255,.10);

      color: #72b5ff;

      font-size: 10px;

      font-weight: 700;
    }

    .badge-success {
      background: rgba(36,209,139,.10);

      color: #63e7ae;
    }

    .badge-danger {
      background: rgba(255,93,115,.10);

      color: #ff91a0;
    }

    .badge-warning {
      background: rgba(255,179,71,.10);

      color: #ffc979;
    }

    /* =====================================================
       EMPTY STATE
    ====================================================== */

    .empty-state {
      padding: 50px 20px;

      text-align: center;

      color: var(--muted);
    }

    .empty-state i {
      font-size: 30px;

      margin-bottom: 13px;

      opacity: .65;
    }

    .empty-state-title {
      color: #dbe5ef;

      font-weight: 700;

      margin-bottom: 6px;
    }

    /* =====================================================
       MODAL
    ====================================================== */

    .modal {
      position: fixed;

      z-index: 300;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,.68);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;

      max-width: 650px;

      max-height: 90vh;

      overflow-y: auto;

      border: 1px solid var(--border-light);

      border-radius: 20px;

      background: var(--panel-strong);

      box-shadow:
        0 30px 100px rgba(0,0,0,.45);

      padding: 24px;
    }

    .modal-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .modal-title {
      font-family: "Space Grotesk", sans-serif;

      font-size: 20px;

      font-weight: 700;
    }

    .modal-close {
      width: 38px;
      height: 38px;

      border: 1px solid var(--border);

      border-radius: 10px;

      background: rgba(255,255,255,.035);

      color: white;
    }

    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 900px) {

      :root {
        --sidebar-width: 250px;
      }

      .sidebar {
        transform: translateX(-100%);

        transition: transform .25s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-area {
        width: 100%;

        margin-left: 0;
      }

      .mobile-menu {
        display: inline-flex;

        align-items: center;
        justify-content: center;
      }

      .topbar {
        padding: 0 18px;
      }

      .content {
        padding: 20px;
      }

    }

    @media (max-width: 650px) {

      .login-card {
        padding: 30px 20px;
      }

      .login-title {
        font-size: 24px;
      }

      .topbar-title {
        display: none;
      }

      .topbar-user-info {
        display: none;
      }

      .page-header {
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .full {
        grid-column: auto;
      }

      .cards-grid {
        grid-template-columns: 1fr 1fr;
      }

    }

    @media (max-width: 430px) {

      .content {
        padding: 15px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 23px;
      }

    }
  </style>
</head>

<body>

  <!-- =====================================================
       ÉCRAN DE CONNEXION
  ====================================================== -->

  <section id="login-screen">

    <div class="login-container">

      <div class="login-card">

        <img
          class="login-logo"
          src="https://i.imghos.co/ScqSjIHB.png"
          alt="DALZON SHULE"
        >

        <h1 class="login-title">
          DALZON SHULE
        </h1>

        <p class="login-subtitle">
          Connecter l'École à la Maison
        </p>

        <form id="login-form">

          <div class="form-group">

            <label
              class="form-label"
              for="email"
            >
              Email ou matricule
            </label>

            <div class="input-wrapper">

              <i class="fa-solid fa-user"></i>

              <input
                id="email"
                class="form-input"
                type="text"
                autocomplete="username"
                placeholder="Votre email ou matricule"
                required
              >

            </div>

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="password"
            >
              Mot de passe
            </label>

            <div class="input-wrapper">

              <i class="fa-solid fa-lock"></i>

              <input
                id="password"
                class="form-input"
                type="password"
                autocomplete="current-password"
                placeholder="Votre mot de passe"
                required
              >

              <button
                type="button"
                id="password-toggle"
                class="password-toggle"
                aria-label="Afficher le mot de passe"
              >
                <i class="fa-solid fa-eye"></i>
              </button>

            </div>

          </div>


          <button
            type="submit"
            id="login-button"
            class="login-button"
          >
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Se connecter</span>
          </button>


          <div
            id="login-error"
            class="login-error"
            role="alert"
          ></div>

        </form>

      </div>

    </div>

  </section>


  <!-- =====================================================
       APPLICATION
  ====================================================== -->

  <section id="app-screen">

    <!-- SIDEBAR -->

    <aside id="sidebar" class="sidebar">

      <div class="sidebar-brand">

        <img
          src="https://i.imghos.co/ScqSjIHB.png"
          alt="DALZON SHULE"
        >

        <div class="sidebar-brand-text">

          <div class="sidebar-brand-title">
            DALZON SHULE
          </div>

          <div class="sidebar-brand-subtitle">
            Gestion scolaire
          </div>

        </div>

      </div>


      <!-- PRINCIPAL -->

      <div class="nav-section">

        <div class="nav-section-title">
          Principal
        </div>

        <button
          class="nav-link active"
          data-route="dashboard"
        >
          <i class="fa-solid fa-chart-line"></i>
          <span>Tableau de bord</span>
        </button>

        <button
          class="nav-link"
          data-route="grades"
        >
          <i class="fa-solid fa-graduation-cap"></i>
          <span>Notes</span>
        </button>

        <button
          class="nav-link"
          data-route="courses"
        >
          <i class="fa-solid fa-book-open"></i>
          <span>Cours</span>
        </button>

        <button
          class="nav-link"
          data-route="attendance"
        >
          <i class="fa-solid fa-calendar-check"></i>
          <span>Présences</span>
        </button>

        <button
          class="nav-link"
          data-route="documents"
        >
          <i class="fa-solid fa-file-lines"></i>
          <span>Documents</span>
        </button>

        <button
          class="nav-link"
          data-route="calendar"
        >
          <i class="fa-solid fa-calendar-days"></i>
          <span>Calendrier</span>
        </button>

      </div>


      <!-- ADMINISTRATION -->

      <div class="nav-section">

        <div class="nav-section-title">
          Administration
        </div>

        <button
          class="nav-link"
          data-route="students"
        >
          <i class="fa-solid fa-users"></i>
          <span>Élèves</span>
        </button>

        <button
          class="nav-link"
          data-route="teachers"
        >
          <i class="fa-solid fa-chalkboard-user"></i>

  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /*
     * =====================================================
     * DALZON SHULE
     * CONFIGURATION SUPABASE
     * =====================================================
     *
     * IMPORTANT :
     *
     * Utiliser UNIQUEMENT la clé Publishable/anon.
     *
     * JAMAIS la clé service_role dans ce fichier.
     */

    const SUPABASE_URL =
      "https://pdjzottshwqyvbjzqivw.supabase.co";


    /*
     * REMPLACE CETTE VALEUR PAR TA VRAIE
     * CLÉ PUBLISHABLE SUPABASE.
     */

    const SUPABASE_PUBLISHABLE_KEY =
      "TA_VRAIE_CLE_PUBLISHABLE_SUPABASE";


    /*
     * Vérification du chargement de Supabase
     */

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== "function"
    ) {

      console.error(
        "DALZON SHULE : Supabase JS n'a pas pu être chargé."
      );

    } else {

      try {

        window.DALZON_SUPABASE =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
              auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
              }
            }
          );


        console.log(
          "DALZON SHULE : Supabase initialisé."
        );


      } catch (error) {

        console.error(
          "DALZON SHULE : erreur initialisation Supabase :",
          error
        );

      }

    }

  </script>


  <!-- =====================================================
       FICHIERS DALZON SHULE
  ====================================================== -->

  <script src="./data.js"></script>

  <script src="./auth.js"></script>

  <script src="./app.js"></script>


  <!-- =====================================================
       INTERFACE / SESSION
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      const loginScreen =
        document.getElementById(
          "login-screen"
        );


      const appScreen =
        document.getElementById(
          "app-screen"
        );


      const loginForm =
        document.getElementById(
          "login-form"
        );


      const loginInput =
        document.getElementById(
          "email"
        );


      const passwordInput =
        document.getElementById(
          "password"
        );


      const passwordToggle =
        document.getElementById(
          "password-toggle"
        );


      const loginButton =
        document.getElementById(
          "login-button"
        );


      const loginError =
        document.getElementById(
          "login-error"
        );


      /* ===================================================
         AFFICHER ERREUR
      =================================================== */

      function showError(message) {

        loginError.textContent =
          message || "Une erreur est survenue.";

        loginError.classList.add(
          "show"
        );

      }


      function hideError() {

        loginError.textContent = "";

        loginError.classList.remove(
          "show"
        );

      }


      /* ===================================================
         ÉCRAN APPLICATION
      =================================================== */

      async function showApplication(user) {

        loginScreen.style.display =
          "none";

        appScreen.classList.add(
          "active"
        );


        /*
         * Mise à jour immédiate du profil
         */

        const nameElement =
          document.getElementById(
            "top-user-name"
          );


        const roleElement =
          document.getElementById(
            "top-user-role"
          );


        const avatarElement =
          document.getElementById(
            "top-avatar"
          );


        if (user) {

          nameElement.textContent =
            user.name ||
            user.fullName ||
            user.email ||
            "Utilisateur";


          roleElement.textContent =
            user.roleLabel ||
            "Utilisateur";


          avatarElement.textContent =
            user.initials ||
            "DS";

        }


        /*
         * Initialisation de l'application
         */

        if (
          window.DALZON_APP &&
          typeof window.DALZON_APP.init === "function"
        ) {

          try {

            await window.DALZON_APP.init(
              user
            );

          } catch (error) {

            console.error(
              "Erreur initialisation application :",
              error
            );

          }

        }

      }


      /* ===================================================
         RETOUR LOGIN
      =================================================== */

      function showLogin() {

        appScreen.classList.remove(
          "active"
        );

        appScreen.style.display =
          "none";

        loginScreen.style.display =
          "flex";

        loginForm.reset();

        hideError();

        loginInput.focus();

      }


      /* ===================================================
         MOT DE PASSE
      =================================================== */

      if (passwordToggle) {

        passwordToggle.addEventListener(
          "click",
          function () {

            const visible =
              passwordInput.type ===
              "text";


            passwordInput.type =
              visible
                ? "password"
                : "text";


            const icon =
              passwordToggle.querySelector(
                "i"
              );


            if (icon) {

              icon.className =
                visible
                  ? "fa-solid fa-eye"
                  : "fa-solid fa-eye-slash";

            }

          }
        );

      }


      /* ===================================================
         CONNEXION
      =================================================== */

      if (loginForm) {

        loginForm.addEventListener(
          "submit",
          async function (event) {

            event.preventDefault();

            hideError();


            const identifier =
              loginInput.value.trim();


            const userPassword =
              passwordInput.value;


            if (!identifier) {

              showError(
                "Veuillez saisir votre email ou matricule."
              );

              return;

            }


            if (!userPassword) {

              showError(
                "Veuillez saisir votre mot de passe."
              );

              return;

            }


            if (
              !window.DALZON_AUTH ||
              typeof window.DALZON_AUTH.login !==
                "function"
            ) {

              showError(
                "Le module d'authentification n'est pas disponible."
              );

              return;

            }


            loginButton.disabled =
              true;


            const originalButtonHTML =
              loginButton.innerHTML;


            loginButton.innerHTML =
              `
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span>Connexion...</span>
              `;


            try {

              const result =
                await window.DALZON_AUTH.login(
                  identifier,
                  userPassword
                );


              if (
                !result ||
                result.error
              ) {

                throw (
                  result?.error ||
                  new Error(
                    "Connexion impossible."
                  )
                );

              }


              /*
               * Récupération utilisateur
               */

              let user =
                result.user ||
                result.data?.user ||
                null;


              /*
               * Si nécessaire, récupérer
               * l'utilisateur complet DALZON.
               */

              if (
                !user &&
                typeof window.DALZON_AUTH
                  .getAuthenticatedUserAsync ===
                  "function"
              ) {

                user =
                  await window.DALZON_AUTH
                    .getAuthenticatedUserAsync();

              }


              if (!user) {

                throw new Error(
                  "Connexion réussie, mais le profil utilisateur n'a pas pu être récupéré."
                );

              }


              await showApplication(
                user
              );


            } catch (error) {

              console.error(
                "DALZON SHULE : erreur connexion :",
                error
              );


              let message =
                error?.message ||
                "Connexion impossible.";


              const lower =
                String(message)
                  .toLowerCase();


              if (
                lower.includes(
                  "invalid login credentials"
                )
              ) {

                message =
                  "Email/matricule ou mot de passe incorrect.";

              } else if (
                lower.includes(
                  "email not confirmed"
                )
              ) {

                message =
                  "Votre adresse email n'est pas encore confirmée.";

              } else if (
                lower.includes(
                  "invalid api key"
                )
              ) {

                message =
                  "Clé Supabase invalide. Vérifiez la clé Publishable utilisée dans index.html.";

              } else if (
                lower.includes(
                  "failed to fetch"
                )
              ) {

                message =
                  "Impossible de contacter Supabase. Vérifiez votre connexion Internet.";

              }


              showError(
                message
              );


            } finally {

              loginButton.disabled =
                false;

              loginButton.innerHTML =
                originalButtonHTML;

            }

          }
        );

      }


      /* ===================================================
         RESTAURATION SESSION
      =================================================== */

      async function restoreSession() {

        if (
          !window.DALZON_AUTH ||
          typeof window.DALZON_AUTH
            .getAuthenticatedUserAsync !==
            "function"
        ) {

          return;

        }


        try {

          const user =
            await window.DALZON_AUTH
              .getAuthenticatedUserAsync();


          if (user) {

            await showApplication(
              user
            );

          } else {

            showLogin();

          }

        } catch (error) {

          console.warn(
            "DALZON SHULE : restauration session impossible.",
            error
          );

          showLogin();

        }

      }


      /* ===================================================
         ÉCOUTER LOGOUT
      =================================================== */

      document.addEventListener(
        "dalzon:logout",
        function () {

          showLogin();

        }
      );


      /* ===================================================
         BOUTON LOGOUT
      =================================================== */

      document.addEventListener(
        "click",
        async function (event) {

          const logoutButton =
            event.target.closest(
              '[data-action="logout"]'
            );


          if (
            !logoutButton ||
            !window.DALZON_AUTH
          ) {

            return;

          }


          try {

            await window.DALZON_AUTH.logout();

          } catch (error) {

            console.error(
              "Erreur déconnexion :",
              error
            );

          }

        }
      );


      /* ===================================================
         MENU MOBILE
      =================================================== */

      const mobileMenu =
        document.getElementById(
          "mobile-menu"
        );


      const sidebar =
        document.getElementById(
          "sidebar"
        );


      if (mobileMenu && sidebar) {

        mobileMenu.addEventListener(
          "click",
          function () {

            sidebar.classList.toggle(
              "open"
            );

          }
        );


        document.addEventListener(
          "click",
          function (event) {

            if (
              window.innerWidth > 900
            ) {

              return;

            }


            if (
              !sidebar.contains(
                event.target
              ) &&
              !mobileMenu.contains(
                event.target
              )
            ) {

              sidebar.classList.remove(
                "open"
              );

            }

          }
        );

      }


      /* ===================================================
         FERMER MENU APRÈS NAVIGATION
      =================================================== */

      document.addEventListener(
        "click",
        function (event) {

          const routeButton =
            event.target.closest(
              "[data-route]"
            );


          if (
            routeButton &&
            window.innerWidth <= 900 &&
            sidebar
          ) {

            sidebar.classList.remove(
              "open"
            );

          }

        }
      );


      /* ===================================================
         DÉMARRAGE
      =================================================== */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          restoreSession
        );

      } else {

        restoreSession();

      }

    })();

  </script>

</body>
